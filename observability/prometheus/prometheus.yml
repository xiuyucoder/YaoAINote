global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: application-telemetry
    static_configs:
      - targets:
          - otel-collector:8889

  # The server's Prometheus exporter exposes contract metrics directly at
  # /metrics. File discovery makes the local default replaceable by deployment
  # target configuration without modifying dashboard queries or alert rules.
  - job_name: yaoainote-server
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/yaoainote-server.yml
